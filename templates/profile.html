<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Settings - InternLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/dashboard">InternLog 🚀</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/dashboard">Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="fw-bold mb-4">Profile Settings</h3>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <div class="mb-4">
                        <label class="text-muted small uppercase">Username</label>
                        <p class="fs-5 fw-bold">{{ session['username'] }}</p>
                    </div>

                    <hr>

                 <form action="/profile" method="POST">
    <h5 class="mb-3">Change Password</h5>
    
    <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" name="old_password" class="form-control" placeholder="Enter your current password" required>
    </div>
    
    <hr>
    
    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Update Password</button>
</form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
