<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InternLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center py-4 bg-light" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">InternLog 🚀</h2>
                    <p class="text-muted">Welcome back! Please login.</p>
                </div>
                <form action="/login" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" name="username" class="form-control" id="u" placeholder="Username" required>
                        <label for="u">Username</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" name="password" class="form-control" id="p" placeholder="Password" required>
                        <label for="p">Password</label>
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-bold shadow-sm" type="submit">Login</button>
                </form>
                <div class="text-center mt-4">
                    <p class="small text-muted">Don't have an account? <a href="/register" class="text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
