<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - InternLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e897c8;      
            --primary-dark: #b54f8e;       
            --bg-color: #ffffff;           
            --card-bg: #fdf8fb;            
            --card-shadow: 0 4px 20px rgba(232, 151, 200, 0.08);
        }

        body { 
            background-color: var(--bg-color); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: #4a4a4a;
        }

        .card { 
            background-color: var(--card-bg) !important;
            border: 1px solid rgba(232, 151, 200, 0.15) !important; 
            border-radius: 16px; 
            box-shadow: var(--card-shadow); 
        }

        .form-control {
            border: 1px solid rgba(232, 151, 200, 0.15) !important;
            background-color: #ffffff !important;
            border-radius: 10px;
            padding: 10px 15px;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus { 
            border-color: var(--primary-color) !important; 
            box-shadow: 0 0 0 0.25rem rgba(232, 151, 200, 0.15) !important; 
        }

        .btn-primary { 
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            color: #ffffff !important;
            border-radius: 10px; 
            font-weight: 600;
            padding: 12px;
        }

        .btn-primary:hover {
            background-color: #d63384 !important;
            border-color: #d63384 !important;
        }

        .back-link {
            color: var(--primary-dark) !important;
            font-weight: 500;
            text-decoration: none;
        }
        .back-link:hover {
            color: #d63384 !important;
            text-decoration: underline !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm p-4 p-md-5">
                <h4 class="fw-bold mb-4" style="color: #444;"><i class="fas fa-sliders-h me-2" style="color: var(--primary-color);"></i>Edit Internship Info</h4>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase" style="color: var(--primary-dark);">Internship Title</label>
                        <input type="text" name="internship_name" class="form-control" value="{{ user['internship_name'] or '' }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase" style="color: var(--primary-dark);">Total Days to Complete</label>
                        <input type="number" name="total_days" class="form-control" value="{{ user['total_days'] or 20 }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Save and Update</button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="/dashboard" class="back-link small"><i class="fas fa-arrow-left me-1"></i> Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
