<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - InternLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto border-0" style="max-width: 500px; border-radius: 15px;">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-4">Edit Internship Info</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Internship Title</label>
                    <input type="text" name="internship_name" class="form-control" value="{{ user['internship_name'] or '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold text-uppercase">Total Days to Complete</label>
                    <input type="number" name="total_days" class="form-control" value="{{ user['total_days'] or 20 }}" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2">Save and Update</button>
            </form>
            <a href="/dashboard" class="d-block text-center mt-3 text-muted small text-decoration-none">← Back to Dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
