<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Log - InternLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e897c8;      /* Dashboard ile uyumlu ana pembe */
            --primary-dark: #b54f8e;       /* Okunabilir başlıklar için koyu pembe */
            --bg-color: #ffffff;           /* Temiz bembeyaz arka plan */
            --card-bg: #fdf8fb;            /* Hafif pudra form kutusu */
            --card-shadow: 0 4px 20px rgba(232, 151, 200, 0.08);
        }

        body { 
            background-color: var(--bg-color); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Inter', sans-serif;
            color: #4a4a4a;
        }

        /* Form Card Layout */
        .card { 
            background-color: var(--card-bg) !important;
            border: 1px solid rgba(232, 151, 200, 0.15) !important; 
            border-radius: 16px; 
            box-shadow: var(--card-shadow); 
        }

        /* Input Custom Styling & Soft Focus Effect */
        .form-control {
            border: 1px solid rgba(232, 151, 200, 0.15) !important;
            background-color: #ffffff !important;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus { 
            border-color: var(--primary-color) !important; 
            box-shadow: 0 0 0 0.25rem rgba(232, 151, 200, 0.15) !important; 
        }

        /* Dynamic Visual Accents */
        .icon-box {
            background-color: var(--primary-color) !important;
            color: #ffffff !important;
            border-radius: 10px; 
            width: 40px; 
            height: 40px;
        }

        /* Buttons & Actions */
        .btn-primary { 
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            color: #ffffff !important;
            border-radius: 10px; 
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #d63384 !important;
            border-color: #d63384 !important;
        }

        /* Soft Navigation Elements */
        .back-link {
            color: var(--primary-dark) !important;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: #d63384 !important;
            text-decoration: underline !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="mb-4">
                <a href="/dashboard" class="text-decoration-none small back-link">
                    <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <div class="card p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box p-2 me-3 d-flex align-items-center justify-content-center">
                        <i class="fas fa-pen-to-square fs-5"></i>
                    </div>
                    <h3 class="fw-bold m-0" style="color: #444;">Create Daily Log</h3>
                </div>

                <form action="/create" method="POST">
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase" style="letter-spacing: 0.5px; color: var(--primary-dark);">Title</label>
                        <input type="text" name="title" class="form-control form-control-lg" style="border-radius: 10px; font-size: 1rem;" required placeholder="e.g., Day 1: Introduction">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase" style="letter-spacing: 0.5px; color: var(--primary-dark);">Content</label>
                        <textarea name="content" rows="8" class="form-control" style="border-radius: 10px; font-size: 1rem; resize: none;" required placeholder="What did you learn or accomplish today?"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm py-3">
                        <i class="fas fa-save me-2"></i> Save Log Entry
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
