<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Log - InternLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); }
        .btn-primary { border-radius: 10px; padding: 10px 20px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="mb-4">
                <a href="/dashboard" class="text-decoration-none small text-muted">
                    <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <div class="card p-4 p-md-5 bg-white">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary text-white rounded-3 p-2 me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="fas fa-pen-to-square fs-5"></i>
                    </div>
                    <h3 class="fw-bold m-0 text-dark">Create Daily Log</h3>
                </div>

                <form action="/create" method="POST">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Title</label>
                        <input type="text" name="title" class="form-control form-control-lg bg-light border-0" style="border-radius: 10px; font-size: 1rem;" required placeholder="e.g., Day 1: Introduction">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.5px;">Content</label>
                        <textarea name="content" rows="8" class="form-control bg-light border-0" style="border-radius: 10px; font-size: 1rem; resize: none;" required placeholder="What did you learn or accomplish today?"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm py-3">
                        <i class="fas fa-save me-2"></i> Save Log Entry
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
